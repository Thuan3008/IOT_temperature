[platformio]
default_envs = wokwi
src_dir = esp32/src
include_dir = esp32/include
lib_dir = esp32/lib
data_dir = esp32/data
test_dir = esp32/test
build_dir = esp32/.pio/build
libdeps_dir = esp32/.pio/libdeps

[env:wokwi]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DWOKWI_SIMULATION
lib_deps =
  2029
  bblanchon/ArduinoJson@^7.4.2
  knolleary/PubSubClient@^2.8

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
  2029
  bblanchon/ArduinoJson@^7.4.2
  knolleary/PubSubClient@^2.8
